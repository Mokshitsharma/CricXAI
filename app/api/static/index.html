<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CricXAI — Strategy Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFBFA;--surface:#FFFFFF;--border:#E8E6E1;--text:#1A1A1A;--muted:#6B6B6B;
    --accent:#1F6F5C;--good:#2E7D32;--warn:#B26A00;--field:#EEF3F0;
    --shadow:0 1px 2px rgba(20,20,20,.04),0 8px 24px rgba(20,20,20,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0E0F11;--surface:#17191C;--border:#2A2D31;--text:#ECECEC;--muted:#9A9A9A;
    --accent:#3FA98C;--good:#66BB6A;--warn:#E0A030;--field:#14201C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0E0F11;--surface:#17191C;--border:#2A2D31;--text:#ECECEC;--muted:#9A9A9A;
      --accent:#3FA98C;--good:#66BB6A;--warn:#E0A030;--field:#14201C;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
    }
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Inter","IBM Plex Sans",system-ui,sans-serif;
    font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;line-height:1.5}
  h1,h2,h3,p{margin:0}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 28px 56px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand h1{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .brand span{color:var(--muted);font-size:13px}
  .headright{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px}
  .tbtn{border:1px solid var(--border);background:var(--surface);color:var(--text);
    border-radius:8px;height:30px;padding:0 12px;font:inherit;font-size:12px;cursor:pointer}
  .label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px}
  .grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  /* builder */
  .builder{padding:20px;display:flex;flex-direction:column;gap:15px}
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld > span{font-size:12px;font-weight:500}
  select,input[type=number]{height:38px;border:1px solid var(--border);border-radius:8px;
    background:var(--surface);color:var(--text);font:inherit;font-size:14px;padding:0 10px;width:100%}
  .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{flex:1;border:0;border-right:1px solid var(--border);background:var(--surface);
    color:var(--muted);font:inherit;font-size:12px;padding:9px 4px;cursor:pointer}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent);color:#fff;font-weight:600}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid var(--border)}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
    padding:3px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted);text-transform:capitalize}
  /* results */
  .results{display:flex;flex-direction:column;gap:20px}
  .primary{padding:24px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px}
  @media(max-width:720px){.primary{grid-template-columns:1fr}}
  .delivery{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:12px 0}
  .statrow{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
  .big{font-size:42px;font-weight:600;line-height:1;color:var(--accent);letter-spacing:-.02em}
  .conf{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 9px;
    border-radius:999px;border:1px solid var(--border);color:var(--muted);text-transform:capitalize}
  .conf.medium{color:var(--warn);border-color:var(--warn)}
  .conf.low{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
  .conf.high{color:var(--good);border-color:var(--good)}
  .reasons{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
  .reasons li{font-size:13.5px;display:flex;gap:8px}
  .reasons li::before{content:"";flex:0 0 6px;height:6px;margin-top:7px;border-radius:2px;background:var(--accent)}
  .fieldbox{border-left:1px solid var(--border);padding-left:22px;display:flex;flex-direction:column;gap:10px}
  @media(max-width:720px){.fieldbox{border-left:0;border-top:1px solid var(--border);padding:18px 0 0}}
  .alts{padding:16px 20px}
  .alt{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
  .alt:last-child{border-bottom:0}
  .alt:hover{color:var(--accent)}
  .alt .n{color:var(--muted);width:16px;font-size:12px}
  .alt .lab{font-size:14px;font-weight:500;flex:1}
  .alt .m{font-size:13px;color:var(--muted);display:flex;gap:22px}
  .heat{padding:18px 20px}
  .hgrid{display:grid;grid-template-columns:76px repeat(7,minmax(0,1fr));gap:3px;margin-top:12px;min-width:560px}
  .hh{font-size:10px;color:var(--muted);text-align:center;align-self:center}
  .hr{font-size:11px;color:var(--muted);align-self:center}
  .hc{aspect-ratio:1/.6;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border-radius:3px}
  .heatscroll{overflow-x:auto}
  .muted{color:var(--muted)}
  .err{color:var(--warn);font-size:13px;padding:14px 0}
  .skel{background:linear-gradient(90deg,var(--border),transparent,var(--border));
    background-size:200% 100%;animation:sh 1.2s infinite;border-radius:6px}
  @keyframes sh{to{background-position:-200% 0}}
  .lowbanner{font-size:12px;color:var(--warn);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M5 7l14 10M19 7L5 17"/></svg>
      <h1>CricXAI</h1><span>Strategy Console</span>
    </div>
    <div class="headright">
      <span id="mv">model —</span>
      <button class="tbtn" id="themebtn">Dark</button>
    </div>
  </header>

  <div class="grid">
    <!-- builder -->
    <form class="card builder" id="builder" autocomplete="off">
      <div class="label">Situation</div>
      <label class="fld"><span>Batsman</span>
        <select id="batsman"></select>
      </label>
      <div class="fld"><span>Bowler type</span>
        <div class="seg" id="bowler"></div>
      </div>
      <div class="two">
        <label class="fld"><span>Over (0–49)</span><input type="number" id="over" min="0" max="49" value="43"></label>
        <label class="fld"><span>Ball (1–6)</span><input type="number" id="ball" min="1" max="6" value="2"></label>
        <label class="fld"><span>Score</span><input type="number" id="score" min="0" value="271"></label>
        <label class="fld"><span>Wickets</span><input type="number" id="wickets" min="0" max="9" value="6"></label>
      </div>
      <div class="two">
        <div class="fld"><span>Innings</span>
          <div class="seg" id="innings">
            <button type="button" data-v="1">1st</button>
            <button type="button" data-v="2" class="on">Chasing</button>
          </div>
        </div>
        <label class="fld" id="targetwrap"><span>Target</span><input type="number" id="target" min="1" value="322"></label>
      </div>
      <div class="chips">
        <span class="chip" id="phasechip">phase · —</span>
        <span class="chip" id="prchip">pressure · —</span>
      </div>
    </form>

    <!-- results -->
    <div class="results">
      <div class="card primary" id="primary">
        <div id="primaryMain"><div class="skel" style="height:180px"></div></div>
        <div class="fieldbox" id="fieldbox"></div>
      </div>

      <div class="card alts" id="altsCard" hidden>
        <div class="label" style="margin-bottom:8px">Alternatives</div>
        <div id="alts"></div>
      </div>

      <div class="card heat">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <div class="label">Length × line — dismissal danger</div>
          <span class="muted" style="font-size:11px">value = P(wicket) ×100 · recommended cell ringed</span>
        </div>
        <div class="heatscroll"><div class="hgrid" id="hgrid"></div></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const BOWLERS = [["pace_right_arm","Pace R"],["pace_left_arm","Pace L"],["off_spin","Off-spin"],["leg_spin","Leg-spin"],["left_arm_spin","SLA"]];
let LENGTHS = ["yorker","full","good","short","bouncer"];
let LINES = ["wide_outside_off","outside_off","off_stump","middle_stump","leg_stump","down_leg","wide_down_leg"];
let state = { bowler:"pace_right_arm", innings:2 };
let seq = 0;

// theme
const root = document.documentElement;
function applyTheme(t){ if(t) root.dataset.theme=t; localStorage.setItem("cx-theme",t||"");
  $("#themebtn").textContent = (root.dataset.theme==="dark"||(!root.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches))?"Light":"Dark"; }
try{ const s=localStorage.getItem("cx-theme"); if(s) applyTheme(s); else applyTheme(); }catch(e){ applyTheme(); }
$("#themebtn").onclick = () => {
  const dark = root.dataset.theme==="dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme:dark)").matches);
  applyTheme(dark?"light":"dark");
};

// phrase helpers
const tit=(s)=>s.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const lineShort=(s)=>s.replace(/_/g," ").replace("outside","out").replace("wide out off","wide off").replace("wide down leg","wide leg");

// build bowler segmented control
$("#bowler").innerHTML = BOWLERS.map(([v,l],i)=>`<button type="button" data-v="${v}" class="${i===0?'on':''}">${l}</button>`).join("");
$("#bowler").onclick = (e)=>{ const b=e.target.closest("button"); if(!b)return;
  [...$("#bowler").children].forEach(x=>x.classList.toggle("on",x===b)); state.bowler=b.dataset.v; run(); };
$("#innings").onclick = (e)=>{ const b=e.target.closest("button"); if(!b)return;
  [...$("#innings").children].forEach(x=>x.classList.toggle("on",x===b)); state.innings=+b.dataset.v;
  $("#targetwrap").style.display = state.innings===2?"":"none"; run(); };

["over","ball","score","wickets","target","batsman"].forEach(id=>{
  $("#"+id).addEventListener("input", debounce(run,250));
});
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

function payload(){
  const m = { innings:state.innings, over:+$("#over").value||0, ball_in_over:+$("#ball").value||1,
    score:+$("#score").value||0, wickets:+$("#wickets").value||0 };
  if(state.innings===2) m.target = +$("#target").value||undefined;
  return { match:m, batsman_id:$("#batsman").value, bowler_type:state.bowler, options:{top_k:3} };
}

async function jpost(path,body){
  const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text(); throw new Error(r.status+" "+t.slice(0,200)); }
  return r.json();
}

async function run(){
  const my = ++seq;
  const body = payload();
  if(!body.batsman_id) return;
  $("#primaryMain").innerHTML = '<div class="skel" style="height:180px"></div>';
  try{
    const [rec, grid] = await Promise.all([ jpost("/v1/recommendation",body), jpost("/v1/grid",body) ]);
    if(my!==seq) return;
    renderSituation(rec.situation, rec.model_version);
    renderPrimary(rec);
    renderAlts(rec);
    renderHeat(grid, rec.recommendations[0]);
  }catch(err){
    if(my!==seq) return;
    const msg = String(err.message||err);
    $("#primaryMain").innerHTML = msg.includes("422")
      ? '<div class="err">Not enough history on this batsman to model this situation.</div>'
      : '<div class="err">Request failed — '+msg+' <a href="#" onclick="run();return false">retry</a></div>';
    $("#fieldbox").innerHTML=""; $("#altsCard").hidden=true; $("#hgrid").innerHTML="";
  }
}

function renderSituation(s,mv){
  $("#mv").textContent = "model "+mv;
  $("#phasechip").textContent = "phase · "+titR(s.phase);
  $("#prchip").textContent = "pressure · "+s.pressure_index;
}
const titR=(s)=>s.replace(/_/g," ");

function renderPrimary(rec){
  const r = rec.recommendations[0];
  const low = rec.situation.low_sample;
  $("#primaryMain").innerHTML = `
    <div class="label">Recommended delivery</div>
    <div class="delivery">${titR(r.label)}</div>
    <div class="statrow">
      <div><div class="big">${(r.dismissal_probability*100).toFixed(1)}%</div>
        <div class="label" style="margin-top:6px">Dismissal probability</div></div>
      <div><div style="font-size:20px;font-weight:600">${r.expected_runs.toFixed(1)}</div>
        <div class="label" style="margin-top:6px">Exp. runs</div></div>
      <span class="conf ${r.confidence}">${r.confidence} confidence</span>
    </div>
    <ul class="reasons">${r.reasons.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ul>
    ${low?'<div class="lowbanner">Low sample — treat the probability as a range.</div>':''}`;
  renderField(r);
}
function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function renderField(r){
  const pts = (r.field_positions||[]).map(p=>{
    const x = 22 + p.x*216, y = 22 + p.y*216;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="var(--accent)"><title>${p.name.replace(/_/g," ")}</title></circle>`;
  }).join("");
  $("#fieldbox").innerHTML = `
    <div class="label">Field · ${escapeHtml(r.field_label)}</div>
    <svg viewBox="0 0 260 260" width="100%" style="background:var(--field);border:1px solid var(--border);border-radius:8px">
      <ellipse cx="130" cy="132" rx="112" ry="118" fill="none" stroke="var(--border)"/>
      <circle cx="130" cy="132" r="54" fill="none" stroke="var(--border)"/>
      <rect x="125" y="188" width="10" height="26" fill="none" stroke="var(--muted)"/>
      ${pts}
      <circle cx="130" cy="192" r="3.6" fill="var(--text)"/>
    </svg>
    <p class="muted" style="font-size:11.5px">Preset positions for the recommended delivery.</p>`;
}

function renderAlts(rec){
  const rest = rec.recommendations.slice(1);
  $("#altsCard").hidden = rest.length===0;
  $("#alts").innerHTML = rest.map(r=>`
    <div class="alt" title="rank ${r.rank}">
      <span class="n">${r.rank}</span>
      <span class="lab">${titR(r.label)}</span>
      <span class="m"><span>${(r.dismissal_probability*100).toFixed(1)}%</span><span>E ${r.expected_runs.toFixed(1)}</span></span>
    </div>`).join("");
}

function renderHeat(grid, rec1){
  const cells = {};
  let min=1, max=0;
  grid.cells.forEach(c=>{ cells[c.length+"|"+c.line]=c;
    min=Math.min(min,c.dismissal_probability); max=Math.max(max,c.dismissal_probability); });
  const ramp = getComputedStyle(root).getPropertyValue("--theme")||"";
  const dark = root.dataset.theme==="dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme:dark)").matches);
  const RAMP = dark
    ? ["#1c2b26","#33362b","#4d3b28","#6e3d27","#8f3b26","#b23a22"]
    : ["#f2efe6","#efe2c9","#e7c9a8","#dcae87","#cf8f6f","#c06a4a"];
  const fg = (i)=> dark ? (i>=2?"#f4ede6":"#c9c4bb") : (i>=4?"#fff":"#4a3f33");
  const rows = [`<div></div>`].concat(LINES.map(l=>`<div class="hh">${lineShort(l)}</div>`));
  LENGTHS.forEach(len=>{
    rows.push(`<div class="hr">${titR(len)}</div>`);
    LINES.forEach(line=>{
      const c = cells[len+"|"+line];
      if(!c){ rows.push(`<div class="hc" style="background:var(--border);opacity:.3"></div>`); return; }
      const v = c.dismissal_probability*100;
      const t = max>min ? (c.dismissal_probability-min)/(max-min) : 0;
      const idx = Math.round(t*(RAMP.length-1));
      const ring = (rec1 && rec1.length===len && rec1.line===line) ? `box-shadow:inset 0 0 0 2px var(--accent);` : "";
      rows.push(`<div class="hc" style="background:${RAMP[idx]};color:${fg(idx)};${ring}" title="${titR(len)} ${lineShort(line)} · ${v.toFixed(1)}% · E ${c.expected_runs.toFixed(1)}">${v.toFixed(1)}</div>`);
    });
  });
  $("#hgrid").innerHTML = rows.join("");
}

// bootstrap
(async function init(){
  try{
    const ref = await (await fetch("/v1/reference")).json();
    LENGTHS = ref.ball_lengths; LINES = ref.ball_lines;
  }catch(e){}
  try{
    const bl = await (await fetch("/v1/batsmen?limit=200")).json();
    $("#batsman").innerHTML = bl.batsmen.map(b=>`<option value="${b.id}">${b.name} — ${b.dismissals} outs</option>`).join("");
    const k = bl.batsmen.find(b=>/kohli/i.test(b.name)); if(k) $("#batsman").value = k.id;
  }catch(e){
    $("#primaryMain").innerHTML = '<div class="err">Could not reach the API. Is the server running on this port?</div>';
    return;
  }
  run();
})();
</script>
</body>
</html>
