name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check app scripts tests
      - name: Build the mock demo dataset + models
        run: |
          python -m scripts.mock_data --num-matches 60 --seed 42
          python -m scripts.build_features
          python -m scripts.train
      - name: Tests (unit + leakage + models + api + extraction quality)
        run: python -m pytest tests/ -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Build
        run: npm run build
    # web/ is scaffolded incrementally; don't block the pipeline on it yet.
    continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/Dockerfile -t cricxai-api:ci .
